name: User Service - Code Security Pipeline

on:
  push:
    branches:
      - actions

jobs:
  code-security:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2. Setup Java (for Sonar)
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. SonarQube Scan (Custom Quality Gate applied in Sonar UI)
    - name: SonarQube Scan
      id: sonar
      uses: SonarSource/sonarqube-scan-action@v2
      with:
        args: >
          -Dsonar.projectKey=user-service
          -Dsonar.sources=.
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    # 4. Quality Gate (FAILS pipeline)
    - name: Quality Gate Check
      id: qualitygate
      uses: SonarSource/sonarqube-quality-gate-action@v1
      timeout-minutes: 5
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    # 5. Setup Python
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # 6. Install Dependencies
    - name: Install Dependencies
      run: pip install -r requirements.txt

    # 7. Snyk Scan (FAIL if MEDIUM/HIGH)
    - name: Snyk Scan
      id: snyk
      uses: snyk/actions/python@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=medium

    # Sonar Failure Email
    - name: Sonar Failure Email
      if: failure() && steps.qualitygate.outcome == 'failure'
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "SonarQube Failed - User Service"
        body: |
          SonarQube Quality Gate Failed.

          Repo: ${{ github.repository }}
          Commit: ${{ github.sha }}

          Check report:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

        to: ${{ secrets.DEVOPS_EMAIL }}
        from: DevOps Alert

    # Snyk Failure Email
    - name: Snyk Failure Email
      if: failure() && steps.snyk.outcome == 'failure'
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "Snyk Failed - User Service"
        body: |
          Snyk found vulnerabilities.

          Repo: ${{ github.repository }}
          Commit: ${{ github.sha }}

          Check logs:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

        to: ${{ secrets.DEVOPS_EMAIL }}
        from: DevOps Alert

    # Success Email
    - name: Success Email
      if: success()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "Code Security Passed"
        body: |
          SonarQube + Snyk passed successfully.

          You can now trigger Docker pipeline manually.

        to: ${{ secrets.DEVOPS_EMAIL }}
        from: DevOps Alert